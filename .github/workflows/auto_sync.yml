name: Automatic Google Drive Catalog Sync

on:
  repository_dispatch:
    types: [drive-updated]
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours automatically
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Torch Hub Model Weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub
          key: ${{ runner.os }}-torch-dinov2-vits14
          restore-keys: |
            ${{ runner.os }}-torch-dinov2-

      - name: Pre-clone DINOv2 Repository (Bypasses 504 Timeout)
        run: |
          mkdir -p ~/.cache/torch/hub
          if [ ! -d ~/.cache/torch/hub/facebookresearch_dinov2_main ]; then
            git clone --depth 1 https://github.com/facebookresearch/dinov2.git ~/.cache/torch/hub/facebookresearch_dinov2_main
          fi

      - name: Run Drive Sync Engine (Pushes to Qdrant Cloud)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python sync_drive.py

      - name: Clean up temporary PDFs
        if: always()
        run: rm -rf pdf_catalogs/
